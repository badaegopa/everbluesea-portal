name: Auto-translate reports

on:
  push:
    branches: [main]
    paths:
      - "public/nations/**.html"
      - "public/engines/**.html"
  # v20 (2026-10-14): Gemini 일일 할당량(429) 때문에 매시 최대 MAX_FILES 편씩(예약 지연·누락 보완, 25편≈60~70분 < timeout 180, 45편은 120분 초과로 취소됨) 나눠 번역
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "all = 전체 소급 / changed = 변경분만"
        default: "all"

# 최소 권한: 기본 읽기 전용, 커밋이 필요한 translate 잡만 쓰기 권한
permissions:
  contents: read

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI }}
      MAX_FILES: "25"
      TIME_BUDGET_MIN: "110"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4==4.13.4

      - name: Translate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            python scripts/translate_reports.py --all
          else
            python scripts/translate_reports.py --all
          fi

      - name: Translate diagrams (script-data pass)
        run: python scripts/translate_diagrams.py --all

      - name: Commit EN files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public translation
          git diff --cached --quiet && exit 0
          git commit -m "auto-translate: EN report files [bot]"
          # v20.2 (2026-10-15): 다른 실행·푸시가 먼저 올라가 거부되면(fetch first) rebase 후 매니페스트 재생성·재시도 — 번역분 유실 방지
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            python scripts/translate_reports.py --manifest-only
            git add public/translations.json
            git diff --cached --quiet || git commit --amend --no-edit
            sleep 5
          done
          exit 1
