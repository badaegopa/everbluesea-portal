name: Auto-translate reports

on:
  push:
    branches: [main]
    paths:
      - "public/nations/**.html"
      - "public/engines/**.html"
  workflow_dispatch:
    inputs:
      scope:
        description: "all = 전체 소급 / changed = 변경분만"
        default: "all"

# 최소 권한: 기본 읽기 전용, 커밋이 필요한 translate 잡만 쓰기 권한
permissions:
  contents: read

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4==4.13.4

      - name: Translate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            python scripts/translate_reports.py --all
          else
            python scripts/translate_reports.py --all
          fi

      - name: Translate diagrams (script-data pass)
        run: python scripts/translate_diagrams.py --all

      - name: Commit EN files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public translation
          git diff --cached --quiet || (git commit -m "auto-translate: EN report files [bot]" && git push)
