name: Auto-translate reports

on:
  push:
    branches: [main]
    paths:
      - "public/nations/**.html"
      - "public/engines/**.html"
  workflow_dispatch:
    inputs:
      scope:
        description: "all = 전체 소급 / changed = 변경분만"
        default: "all"

permissions:
  contents: write

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Debug secret
        run: |
          echo "KEY_LENGTH=${#GEMINI_API_KEY}"
          echo "KEY_PREFIX=${GEMINI_API_KEY:0:4}"

      - name: Translate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            python scripts/translate_reports.py --all
          else
            python scripts/translate_reports.py
          fi

      - name: Commit EN files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --cached --quiet || (git commit -m "auto-translate: EN report files [bot]" && git push)
