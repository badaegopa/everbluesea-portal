name: Auto-translate reports

on:
  # v21 (2026-10-16 청해 "1차 번역 → 2차 검증 후 배포"): 자동 트리거(push·schedule) 해제.
  # 영문판은 AI PC 로컬 번역기(eb-pipeline/local_translate.py, qwen2.5-eb:14b-v3)가 1차 번역 + 2차 검증 통과분만 배포한다.
  # 이 워크플로는 Gemini 수동 보조용(Run workflow)으로만 남긴다 — 수동 실행분은 검증을 거치지 않으므로 필요할 때만.
  workflow_dispatch:
    inputs:
      scope:
        description: "all = 전체 소급 / changed = 변경분만"
        default: "all"

# 최소 권한: 기본 읽기 전용, 커밋이 필요한 translate 잡만 쓰기 권한
permissions:
  contents: read

concurrency:
  group: auto-translate
  cancel-in-progress: false

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI }}
      MAX_FILES: "25"
      TIME_BUDGET_MIN: "110"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4==4.13.4

      - name: Translate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            python scripts/translate_reports.py --all
          else
            python scripts/translate_reports.py --all
          fi

      - name: Translate diagrams (script-data pass)
        run: python scripts/translate_diagrams.py --all

      - name: Commit EN files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public translation
          git diff --cached --quiet && exit 0
          git commit -m "auto-translate: EN report files [bot]"
          # v20.2 (2026-10-15): 다른 실행·푸시가 먼저 올라가 거부되면(fetch first) rebase 후 매니페스트 재생성·재시도 — 번역분 유실 방지
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            python scripts/translate_reports.py --manifest-only
            git add public/translations.json
            git diff --cached --quiet || git commit --amend --no-edit
            sleep 5
          done
          exit 1
