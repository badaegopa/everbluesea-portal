  <line x1="400" y1="330" x2="295" y2="330" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="295" cy="330" r="6" fill="#5E9186" opacity="0.75"/>
  <text x="281" y="334" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186" text-anchor="end">A9</text>
  <!-- A10 -->
  <line x1="400" y1="330" x2="248" y2="252" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="248" cy="252" r="6" fill="#5E9186" opacity="0.75"/>
  <text x="234" y="246" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186" text-anchor="end">A10</text>
  <!-- A11 -->
  <line x1="400" y1="330" x2="300" y2="190" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="300" cy="190" r="6" fill="#5E9186" opacity="0.7"/>
  <text x="286" y="184" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186" text-anchor="end">A11</text>
  <!-- A12 -->
  <line x1="400" y1="330" x2="470" y2="163" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="470" cy="163" r="6" fill="#5E9186" opacity="0.7"/>
