<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F5F3EE"/>

  <!-- 타이틀 -->
  <text x="400" y="40" font-family="Georgia,serif" font-size="18" fill="#3a5f5a" text-anchor="middle" font-weight="bold">압박 좌표계 — 봉기 코호트 구독판 4부작</text>
  <text x="400" y="60" font-family="Courier New,monospace" font-size="11" fill="#8a8880" text-anchor="middle" letter-spacing="1">P* = 0.445806 · Λ¹² v2.1 × BSLI v7.0 · 2016→2024</text>

  <!-- 임계 밴드 (P* 반경) -->
  <circle cx="400" cy="330" r="150" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.75"/>
  <text x="400" y="172" font-family="Courier New,monospace" font-size="11" fill="#C0392B" text-anchor="middle">임계 밴드 P*</text>

  <!-- 내부 궤도 그리드 -->
  <circle cx="400" cy="330" r="60" fill="none" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="400" cy="330" r="105" fill="none" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="400" cy="330" r="200" fill="none" stroke="#DDD8CE" stroke-width="1"/>

  <!-- 중심: BSLI 태양 -->
  <circle cx="400" cy="330" r="30" fill="#B8850E" opacity="0.16"/>
  <circle cx="400" cy="330" r="19" fill="#B8850E" opacity="0.85"/>
  <text x="400" y="335" font-family="Georgia,serif" font-size="12" fill="#F5F3EE" text-anchor="middle" font-weight="bold">BSLI</text>

