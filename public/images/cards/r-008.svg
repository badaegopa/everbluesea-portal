  <line x1="400" y1="330" x2="256" y2="437" stroke="#C0392B" stroke-width="1.6" opacity="0.5"/>
  <circle cx="256" cy="437" r="10" fill="#C0392B" opacity="0.9"/>
  <text x="242" y="458" font-family="Courier New,monospace" font-size="11" fill="#C0392B" text-anchor="end" font-weight="bold">A8 거버넌스</text>
