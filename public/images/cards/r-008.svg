  <text x="400" y="118" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186" text-anchor="middle">A1</text>
  <!-- A2 (밴드 내) -->
  <line x1="400" y1="330" x2="510" y2="203" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="510" cy="203" r="9" fill="#C0392B" opacity="0.85"/>
  <text x="524" y="196" font-family="Courier New,monospace" font-size="10.5" fill="#C0392B" font-weight="bold">A2</text>
  <!-- A3 -->
  <line x1="400" y1="330" x2="566" y2="266" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="566" cy="266" r="6" fill="#5E9186" opacity="0.75"/>
  <text x="580" y="262" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186">A3</text>
  <!-- A4 -->
  <line x1="400" y1="330" x2="505" y2="330" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="505" cy="330" r="6" fill="#5E9186" opacity="0.75"/>
  <text x="519" y="334" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186">A4</text>
  <!-- A5 (밴드 내) -->
  <line x1="400" y1="330" x2="533" y2="407" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="533" cy="407" r="9" fill="#C0392B" opacity="0.85"/>
  <text x="547" y="412" font-family="Courier New,monospace" font-size="10.5" fill="#C0392B" font-weight="bold">A5</text>
  <!-- A6 -->
  <line x1="400" y1="330" x2="452" y2="420" stroke="#DDD8CE" stroke-width="0.8"/>
  <circle cx="452" cy="420" r="6" fill="#5E9186" opacity="0.75"/>
  <text x="462" y="436" font-family="Courier New,monospace" font-size="10.5" fill="#5E9186">A6</text>
