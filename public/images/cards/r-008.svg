  <!-- 시계열 궤적 (2016→2024, 바깥으로 이동) -->
  <path d="M418 300 C470 288 500 250 510 210" fill="none" stroke="#8a5800" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M406 356 C404 400 402 440 400 478" fill="none" stroke="#8a5800" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="600" y="330" font-family="Courier New,monospace" font-size="10.5" fill="#8a5800">궤적 = 2016→2024</text>

  <!-- 경로 범례 -->
  <rect x="42" y="500" width="14" height="10" fill="#6c9bcb" opacity="0.85"/>
  <text x="62" y="510" font-family="Georgia,serif" font-size="12" fill="#555">WD 미방출 · BOL</text>
  <rect x="42" y="522" width="14" height="10" fill="#C0392B" opacity="0.85"/>
  <text x="62" y="532" font-family="Georgia,serif" font-size="12" fill="#555">SN 방출 · LKA·BGD</text>
  <rect x="42" y="544" width="14" height="10" fill="#5b3a6e" opacity="0.85"/>
  <text x="62" y="554" font-family="Georgia,serif" font-size="12" fill="#555">BH 전환 · IRN</text>
  <rect x="42" y="566" width="14" height="10" fill="#5E9186" opacity="0.85"/>
  <text x="62" y="576" font-family="Georgia,serif" font-size="12" fill="#555">대조군 · KOR (밴드 0축)</text>

  <!-- 수록 편수 -->
  <text x="758" y="510" font-family="Courier New,monospace" font-size="12" fill="#3a5f5a" text-anchor="end">수록 4편 · 비교 6국</text>
  <text x="758" y="530" font-family="Courier New,monospace" font-size="11" fill="#8a8880" text-anchor="end">IRN · BOL · LKA · COHORT</text>
  <text x="758" y="552" font-family="Courier New,monospace" font-size="11" fill="#8a8880" text-anchor="end">공통 척추 A7 · A8 (봉기 5국 전부)</text>
  <text x="758" y="574" font-family="Georgia,serif" font-size="11" fill="#a9a79f" text-anchor="end">EVERBLUE SEA INSTITUTE</text>
</svg>
